[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "exec-impact"
version = "0.1.0"
description = "Calibrate crypto market impact and compare Almgren-Chriss vs TWAP/VWAP."
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.10.1",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
]
stretch = [
    "cvxpy==1.6.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
